apiVersion: v1
kind: Secret
metadata:
  name: sample-kubernetes-manifests
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
stringData:
  type: git
  url: https://github.com/<team>/<repo_name>.git

---

apiVersion: v1
kind: Secret
metadata:
  name: private-repo-creds
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repo-creds
stringData:
  type: git
  url: https://github.com/<team>
  githubAppID: "00xx000"
  githubAppInstallationID: "123xxxx45"
  githubAppPrivateKey: |
    -----BEGIN RSA PRIVATE KEY-----
    ******************************
    -----END RSA PRIVATE KEY-----
