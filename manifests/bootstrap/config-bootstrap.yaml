apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: config-bootstrap
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/<team>/<repo_name>.git
    path: manifests/bootstrap-config/
    targetRevision: master
    directory:
      recurse: true
